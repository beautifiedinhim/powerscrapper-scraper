use_default_settings: true

server:
  secret_key: "powerscrapper-searxng-2026"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
  - name: bing
    engine: bing
    shortcut: b
    disabled: false
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false
  - name: yandex
    engine: yandex
    shortcut: y
    disabled: false
  - name: wikidata
    engine: wikidata
    shortcut: wd
    disabled: true

outgoing:
  request_timeout: 10
  user_agent_suffix: ""
